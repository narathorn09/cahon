name: Desktop installers

# Builds the Windows installer (.exe) and macOS disk images (.dmg, Apple
# silicon and Intel), with OCR (Tesseract + Thai) and the Rust readers inside,
# then runs each built app once (tools/smoke_desktop.py).
#
# Releasing (the version is cahon/__version__), either:
#   * push a tag vX.Y.Z that points at a commit on main
#     (python tools/release.py X.Y.Z && git push origin main vX.Y.Z), or
#   * Actions > Desktop installers > Run workflow on main with "release" ticked:
#     CI creates the tag vX.Y.Z itself.
# The release job publishes only after every installer built and passed its
# smoke test, and only from main; installed apps then offer the update.

on:
  push:
    branches: [main, dev, "claude/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<version>) from this commit - main only"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TESSDATA: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version (and, for a release tag, check it)
        run: |
          APP_VERSION=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('cahon/__init__.py').read_text()).group(1))")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "${GITHUB_REF_NAME#v}" = "$APP_VERSION" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $APP_VERSION"; exit 1; }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "release tags must point at a commit on main"; exit 1; }
          fi
      - name: Python packages, Rust readers
        run: |
          python -m pip install --upgrade pip
          # Wheels only for cryptography: a source build links the system OpenSSL,
          # which clashes with the one PyInstaller bundles (seen on Intel Macs).
          pip install --only-binary=cryptography -r requirements.txt pyinstaller pywebview
          pip install ./native
          python -c "import cahon_native; print('cahon_native', cahon_native.__version__)"
      - name: Tesseract (OCR) with Thai
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "packaging\build\tesseract"
          New-Item -ItemType Directory -Force "$dst\tessdata\configs" | Out-Null
          Copy-Item "$src\tesseract.exe" $dst
          Copy-Item "$src\*.dll" $dst
          Copy-Item "$src\tessdata\configs\txt", "$src\tessdata\configs\tsv" "$dst\tessdata\configs"
          foreach ($lang in "eng", "tha") {
            Invoke-WebRequest "$env:TESSDATA/$lang.traineddata" -OutFile "$dst\tessdata\$lang.traineddata"
          }
          & "$dst\tesseract.exe" --version
          & "$dst\tesseract.exe" --tessdata-dir "$dst\tessdata" --list-langs
      - name: Build app
        run: |
          python packaging/make_icon.py packaging/build/icons
          pyinstaller packaging/cahon.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test
        run: python tools/smoke_desktop.py "dist/CAHON/CAHON.exe"
      - name: Clipboard (copy button in the app window)
        run: python tools/check_clipboard.py
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=..\..\dist\CAHON" packaging\windows\installer.iss
          Get-ChildItem dist\*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CAHON-windows
          path: dist/CAHON-Setup-*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    # Developer ID signing + Apple notarization, so Gatekeeper opens the app without
    # "Apple could not verify…". Runs only when these repository secrets are set
    # (README: "เซ็นแอป Mac"); without them the app is signed ad hoc as before.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version (and, for a release tag, check it)
        run: |
          APP_VERSION=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('cahon/__init__.py').read_text()).group(1))")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "${GITHUB_REF_NAME#v}" = "$APP_VERSION" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $APP_VERSION"; exit 1; }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "release tags must point at a commit on main"; exit 1; }
          fi
      - name: Python packages, Rust readers
        run: |
          python -m pip install --upgrade pip
          # Wheels only for cryptography: a source build links the system OpenSSL,
          # which clashes with the one PyInstaller bundles (seen on Intel Macs).
          pip install --only-binary=cryptography -r requirements.txt pyinstaller pywebview
          pip install ./native
          python -c "import cahon_native; print('cahon_native', cahon_native.__version__)"
      - name: Tesseract (OCR) with Thai, made self-contained
        run: |
          brew install tesseract dylibbundler
          dst=packaging/build/tesseract
          mkdir -p "$dst/tessdata/configs" "$dst/libs"
          cp "$(brew --prefix tesseract)/bin/tesseract" "$dst/tesseract"
          chmod u+w "$dst/tesseract"
          # Copy its libraries next to it and point the binary at them.
          dylibbundler -cd -of -b -x "$dst/tesseract" -d "$dst/libs" -p @executable_path/libs/
          codesign --force -s - "$dst"/libs/*.dylib "$dst/tesseract"
          cp "$(brew --prefix tesseract)/share/tessdata/configs/txt" "$(brew --prefix tesseract)/share/tessdata/configs/tsv" "$dst/tessdata/configs/"
          for lang in eng tha; do curl -fsSL "$TESSDATA/$lang.traineddata" -o "$dst/tessdata/$lang.traineddata"; done
          TESSDATA_PREFIX="$dst/tessdata" "$dst/tesseract" --list-langs
          otool -L "$dst/tesseract" | head
      - name: Build app
        run: |
          python packaging/make_icon.py packaging/build/icons
          pyinstaller packaging/cahon.spec --noconfirm --distpath dist --workpath build
      - name: Sign (ad hoc without the Apple secrets)
        if: env.MACOS_CERT_P12 == ''
        run: codesign --force --deep -s - "dist/CAHON.app"
      - name: Sign with Developer ID
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PASS="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application certificate in MACOS_CERT_P12"; exit 1; }
          echo "MAC_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          packaging/macos/sign.sh "dist/CAHON.app" "$IDENTITY"
      - name: Smoke test
        run: python tools/smoke_desktop.py "dist/CAHON.app/Contents/MacOS/CAHON"
      - name: Clipboard (copy button in the app window)
        run: python tools/check_clipboard.py
      # WebKit is current only on the macOS 15 runner: Playwright's WebKit for macOS 14 is frozen
      # and hung at launch. One run covers it: the layout is the same CSS on both chips.
      - name: Results list in WebKit (the engine of the Mac app window)
        if: matrix.arch == 'x86_64'
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pip install playwright
          python -m playwright install webkit
          LAYOUT_SHOT=dist/layout-webkit-${{ matrix.arch }}.png python tools/check_layout.py "dist/CAHON.app/Contents/MacOS/CAHON"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-webkit-${{ matrix.arch }}
          path: dist/layout-webkit-*.png
          if-no-files-found: ignore
      - name: Disk image
        run: |
          mkdir -p dmg
          cp -R "dist/CAHON.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "CAHON" -srcfolder dmg -ov -format UDZO \
            "dist/CAHON-${APP_VERSION}-macos-${{ matrix.arch }}.dmg"
      - name: Notarize (Apple checks it; Gatekeeper then opens it without a warning)
        if: env.MACOS_CERT_P12 != ''
        run: |
          DMG="dist/CAHON-${APP_VERSION}-macos-${{ matrix.arch }}.dmg"
          codesign --force --timestamp --sign "$MAC_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json | tee notary.json
          python3 -c "import json,sys; s=json.load(open('notary.json'))['status']; print('notary:', s); sys.exit(s != 'Accepted')" || {
            id=$(python3 -c "import json; print(json.load(open('notary.json'))['id'])")
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"; exit 1; }
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
      - name: Remove the signing keychain
        if: always() && env.MACOS_CERT_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: CAHON-macos-${{ matrix.arch }}
          path: dist/CAHON-*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check version, branch and tag
        run: |
          VERSION=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('cahon/__init__.py').read_text()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "releases are made from commits on main"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "${GITHUB_REF_NAME#v}" = "$VERSION" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $VERSION"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released: raise the version first (tools/release.py)"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: CAHON-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: CAHON ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
